[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-discovery-agent"
version = "0.1.0"
description = "A local, zero-cost AI agent that discovers public customer feedback and turns it into evidence-backed product opportunities."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
scheduler = ["apscheduler>=3.10,<4"]
dev = ["pytest>=8"]

[project.scripts]
pda = "pda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
